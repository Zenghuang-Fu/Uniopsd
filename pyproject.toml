[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniopsd"
version = "0.1.0"
description = "Correlation-guided on-policy self-distillation for language agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24", "torch>=2.8,<2.9", "torchvision>=0.23,<0.24",
  "transformers==4.57.3", "tensordict==0.10.0", "torchdata==0.11.0",
  "ray[default]==2.50.0", "hydra-core>=1.3,<1.4", "omegaconf>=2.3,<2.4",
  "datasets>=3", "pandas", "pyarrow>=19", "accelerate", "peft>=0.17",
  "codetiming", "dill", "packaging", "pybind11", "pylatexenc", "PyYAML",
  "qwen-vl-utils[decord]", "gym==0.26.2", "gymnasium==0.29.1", "requests",
  "func_timeout", "rich", "tqdm"
]

[project.optional-dependencies]
train = ["vllm==0.11.0", "flash-attn==2.8.3"]
alfworld = ["alfworld==0.4.2", "textworld==1.7.0", "stable-baselines3==2.6.0"]
webshop = ["beautifulsoup4", "clean-text", "flask", "rank-bm25", "pyserini==0.22.1", "spacy>=3.8,<4", "selenium"]
search = ["fastapi", "uvicorn", "faiss-cpu"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["uniopsd*", "verl*", "agent_system*", "gigpo*"]
exclude = ["tests*", "examples*", "agent_system.environments.env_package.webshop.webshop.transfer*"]
namespaces = true

[tool.setuptools.package-data]
verl = ["version/*", "trainer/config/*.yaml"]
agent_system = ["**/*.yaml", "**/*.json", "**/*.html", "**/*.css", "**/*.pddl", "**/*.twl2", "**/LICENSE*", "**/COPYING*", "**/*.txt", "**/*.png", "**/*.ttf", "**/*.npy", "**/*.c", "**/*.h", "**/*.l", "**/*.y", "**/makefile"]
